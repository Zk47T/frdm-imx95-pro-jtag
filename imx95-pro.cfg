# NXP i.MX95 on the FRDM-IMX95-PRO, JTAG or SWD through the CH347F: discovery config.
# Written from the documents (2026-10-15); not yet run on the board.
#
# From the RM (Rev. 5, ch. 14) and the board files (SCH-95794_B1):
# - One debug port with two SWJ-DPs behind it, switched by a mux.
#   - Before debug is authenticated, the port reaches SWJ-DP (AUTH):
#     AP 0 = ISP-AP (the debug mailbox, IDR 0x002A0000), AP 1 = JTAG-AP.
#   - After it, the normal SWJ-DP (Table 77): AP 0 AHB-AP (system bus), AP 1 APB-AP (A55
#     debug and CoreSight), AP 2 the M7, AP 3 the M33, AP 6 MDM-AP, AP 10 GPU, AP 11 NPU.
# - JTAG: the IR is 8 bits. The JTAGC (boundary scan) and the JTAG-DP share it: the JTAGC
#   decodes the IR and muxes TDO, so the chain shows one TAP.
#   - After a TAP reset, its IDCODE is the JTAGC's (bits 16:12 = 11000; the i.MX93's is
#     0x0892801d, mfg 0x00e).
#   - The DP answers DPACC 0xFA, APACC 0xFB, ABORT 0xF8 and IDCODE 0xFE. OpenOCD's
#     adi_v5_jtag.c already sends these values.
# - SWD: SWDIO on the TMS pad, SWCLK on TCK. TDO then carries SWO (RM 14.3.4.1.3).
# - The pads are at 3.3 V: VTREF on TP6 is VDD_3V3 through R20. Set the CH347F's VIO to 3.3 V.
#
# Variables, set with -c before -f:
#   IMX95_TAPID  the IDCODE that 'ocd.sh scan' found, to check it (default: no check)
#   IMX95_A55    1: also create the cores (six A55, the M7, the M33) and two memory APs.
#                Every one waits for 'arp_examine': before authentication AP 0 is the ISP-AP.
#   IMX95_DBG0   A55 core 0's debug block as the APB-AP sees it. Default 0x80810000,
#                measured 2026-10-16: the APB-AP sees the RM's 0x41xxxxxx debug map at
#                0x81xxxxxx (its ROM table is at 0x80000000, the A55 cluster's at
#                0x80800000, core 0's PIDR there reads part 0xD05). The RM's Table 76
#                gives 0x40810000. Core n is at + n * 0x100000, its CTI at + 0x10000,
#                its PMU at + 0x20000, its ETM at + 0x30000.
#                Don't read the cluster (0x808xxxxx) while it is powered off (SDP, before
#                U-Boot): the read never completes and every later APB-AP access fails
#                until a power cycle; a DP ABORT does not clear it.

if { [string match *swd* [transport select]] } {
	swd newdap imx95 cpu
} elseif { [info exists IMX95_TAPID] } {
	jtag newtap imx95 cpu -irlen 8 -ircapture 0x01 -irmask 0x03 -expected-id $IMX95_TAPID
} else {
	jtag newtap imx95 cpu -irlen 8 -ircapture 0x01 -irmask 0x03
}

# The AUTH DP may never raise CSYSPWRUPACK: the system side stays gated until the ELE allows
# debug. CDBGPWRUPACK is still required; 'ocd.sh dp' shows whether it comes.
dap create imx95.dap -tap imx95.cpu -ignore-syspwrupack

if { [info exists IMX95_DBG0] } { set _DBG0 $IMX95_DBG0 } else { set _DBG0 0x80810000 }

# There is no reset line. TP3 reaches SYS_RST_B only through D3, which is not fitted. With D3
# fitted and SWD, wire TP3 to the CH347F's TRST pin and add:
#   reset_config srst_only srst_open_drain
reset_config none

if { [info exists IMX95_A55] } {
	target create imx95.ahb mem_ap -dap imx95.dap -ap-num 0 -defer-examine
	# the A55 debug registers themselves, for the procedures in imx95-jtag.tcl
	target create imx95.apb mem_ap -dap imx95.dap -ap-num 1 -defer-examine

	# U-Boot runs on core 0 only; Linux starts cores 1-5. As in OpenOCD's imx8m.cfg:
	# one SMP group, with the cores shown to gdb as threads.
	set _smp "target smp"
	for { set n 0 } { $n < 6 } { incr n } {
		set base [expr {$_DBG0 + $n * 0x100000}]
		cti create imx95.cti.$n -dap imx95.dap -ap-num 1 -baseaddr [expr {$base + 0x10000}]
		set cmd "target create imx95.a55.$n aarch64 -dap imx95.dap -ap-num 1 -coreid $n \
			-dbgbase $base -cti imx95.cti.$n -defer-examine"
		if { $n == 0 } { append cmd " -rtos hwthread" }
		eval $cmd
		append _smp " imx95.a55.$n"
	}
	eval $_smp

	# The M7 runs NXP's demo from TCM; the M33 runs the System Manager, in secure state:
	# halting it needs the M33's debug enables from the ELE (RM 14.2.2 note).
	target create imx95.m7 cortex_m -dap imx95.dap -ap-num 2 -defer-examine
	target create imx95.m33 cortex_m -dap imx95.dap -ap-num 3 -defer-examine

	targets imx95.a55.0
}
