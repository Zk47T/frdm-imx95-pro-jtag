#
# WCH CH347 USB to JTAG/SWD (OpenOCD's ch347 driver, in OpenOCD from git).
#   CH347F: no mode pins, USB 1a86:55de. Its I/O follows the module's VIO: set it to the target's level.
#   CH347T: mode 3 (CFG0 and CFG1 low at power-up), USB 1a86:55dd; I/O fixed at 3.3 V.
# JTAG clocks are 60 MHz / 2^n (a request between two steps gets the higher one); SWD tops out at 5 MHz.
# USB access without root: OpenOCD's contrib/60-openocd.rules already lists both IDs.

adapter driver ch347
adapter usb vid_pid 0x1a86 0x55dd 0x1a86 0x55de
