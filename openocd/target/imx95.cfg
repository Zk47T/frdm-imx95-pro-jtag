#
# NXP i.MX 95: six Cortex-A55 (one cluster), a Cortex-M7, and a Cortex-M33 (the System Manager).
# Tested on the FRDM-IMX95-PRO (i.MX 9596) with OpenOCD from git, JTAG and SWD, 2026-10-16.
# It needs an open debug port. It is open on that board in serial-download mode and when U-Boot or
# Linux runs; a closed part needs the ELE's debug authentication first.
#
# The debug port (one DP, its access ports):
#   AP 0  AHB-AP   the system bus, 32-bit addresses: only the low 4 GB  -> target $_CHIPNAME.ahb
#   AP 1  APB-AP   A55 debug and CoreSight (ETM/ETF/ETR)               -> target $_CHIPNAME.apb
#   AP 2  the Cortex-M7                                               -> target $_CHIPNAME.m7
#   AP 3  the Cortex-M33 (System Manager, secure)                     -> target $_CHIPNAME.m33
#   AP 6  MDM-AP   (status, JTAG_SW_RST)
# The A55 debug blocks as the APB-AP sees them: core n at 0x80810000 + n * 0x100000, its CTI at
# + 0x10000. (The reference manual's 0x40810000 is the A55's own view of the same blocks.)
#
# !! The A55s are examined only on request: imx95_a55. In serial-download mode the A55 cluster is
# powered off, and a read of its debug blocks (0x808xxxxx on the APB-AP) never completes: the APB-AP
# stays wedged until a power cycle. Run imx95_a55 once U-Boot or Linux is running, and boot Linux
# with cpuidle.off=1 to keep every core powered.
#
# After 'init':
#   imx95_a55 [CORES]   examine the A55s (default 0 1 2 3 4 5); gdb: port 3333, the cores as threads
#   imx95_m7            examine the M7 (attach only: it runs what the System Manager loaded); gdb: 3334
#   imx95_fast          memory access at the speed the probe allows (OpenOCD's default idles 255
#                       clocks per access: 15 KiB/s through a CH347F, 105 with this)
#
# Variables: CHIPNAME (imx95), DAP_TAPID (JTAG IDCODE 0x9893801d, version ignored; SWD DPIDR
# 0x6ba02477), A55_DBGBASE (0x80810000).

source [find target/swj-dp.tcl]

if { [info exists CHIPNAME] } {
	set _CHIPNAME $CHIPNAME
} else {
	set _CHIPNAME imx95
}

if { [info exists DAP_TAPID] } {
	set _DAP_TAPID $DAP_TAPID
} elseif { [using_jtag] } {
	set _DAP_TAPID 0x9893801d
} else {
	set _DAP_TAPID 0x6ba02477
}

if { [info exists A55_DBGBASE] } {
	set _A55_DBGBASE $A55_DBGBASE
} else {
	set _A55_DBGBASE 0x80810000
}

# One TAP: the boundary-scan controller and the JTAG-DP share an 8-bit IR
swj_newdap $_CHIPNAME cpu -irlen 8 -ircapture 0x01 -irmask 0x03 -expected-id $_DAP_TAPID -ignore-version
dap create $_CHIPNAME.dap -tap $_CHIPNAME.cpu

target create $_CHIPNAME.ahb mem_ap -dap $_CHIPNAME.dap -ap-num 0
target create $_CHIPNAME.apb mem_ap -dap $_CHIPNAME.dap -ap-num 1

# The A55s: one SMP group, the cores shown to gdb as threads (as OpenOCD's imx8m.cfg)
set _smp "target smp"
for { set _n 0 } { $_n < 6 } { incr _n } {
	set _base [expr {$_A55_DBGBASE + $_n * 0x100000}]
	cti create $_CHIPNAME.a55_cti.$_n -dap $_CHIPNAME.dap -ap-num 1 -baseaddr [expr {$_base + 0x10000}]
	set _cmd "target create $_CHIPNAME.a55.$_n aarch64 -dap $_CHIPNAME.dap -ap-num 1 -coreid $_n \
		-dbgbase $_base -cti $_CHIPNAME.a55_cti.$_n -defer-examine"
	if { $_n == 0 } { append _cmd " -rtos hwthread" }
	eval $_cmd
	append _smp " $_CHIPNAME.a55.$_n"
}
eval $_smp

target create $_CHIPNAME.m7 cortex_m -dap $_CHIPNAME.dap -ap-num 2 -defer-examine
# the System Manager runs in secure state; halting it needs the ELE's debug enables
target create $_CHIPNAME.m33 cortex_m -dap $_CHIPNAME.dap -ap-num 3 -defer-examine

# gdb halts a target when it attaches; let 'detach' resume it, as gdb's detach means (OpenOCD
# leaves it halted: Linux and the M7 stayed stopped after a detach, 2026-10-16)
$_CHIPNAME.a55.0 configure -event gdb-detach { resume }
$_CHIPNAME.m7 configure -event gdb-detach { resume }

targets $_CHIPNAME.a55.0

proc imx95_a55 {{cores {0 1 2 3 4 5}}} {
	foreach n $cores {
		$::_CHIPNAME.a55.$n arp_examine
		$::_CHIPNAME.a55.$n arp_poll
	}
	targets $::_CHIPNAME.a55.[lindex $cores 0]
}

proc imx95_m7 {} {
	$::_CHIPNAME.m7 arp_examine
	$::_CHIPNAME.m7 arp_poll
}

proc imx95_fast {} {
	# idle clocks per memory access: JTAG needs 8 on this DAP (0 makes the AP answer WAIT); the
	# CH347F's SWD runs at 2 (1 or 0 fail loudly, never silently)
	set n [expr {[using_jtag] ? 8 : 2}]
	set sel [$::_CHIPNAME.dap apsel]
	foreach ap {0 1} {
		$::_CHIPNAME.dap apsel $ap
		$::_CHIPNAME.dap memaccess $n
	}
	$::_CHIPNAME.dap apsel $sel
}
