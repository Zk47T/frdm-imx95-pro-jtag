#
# NXP FRDM-IMX95-PRO (i.MX 9596) through a WCH CH347F on the board's JTAG test points.
#
# The board has no debug probe and no JTAG header. The rework:
#   - fit 0 ohm (0402) on R104 (TMS), R125 (TCK), R132 (TDO), R135 (TDI): not fitted from the factory
#   - wires: TP1 TMS, TP2 TDO, TP4 TCK, TP5 TDI, TP7 GND; TP6 is VTREF (3.3 V), for a meter only
#   - the CH347F's VIO jumper on 3.3 V
# The pads are shared with LPUART5 (Bluetooth): disable it in the Linux DT to debug while Linux runs.
# There is no reset line (TP3 reaches SYS_RST_B only through D3, not fitted).
#
#   openocd -s openocd -f board/nxp_frdm-imx95-pro.cfg -c init -c imx95_fast -c imx95_a55 -c imx95_m7
#   gdb: target extended-remote :3333 (A55s, as threads), :3334 (M7)
# SWD instead of JTAG (SWDIO on TMS, SWCLK on TCK): -c "set TRANSPORT swd" before -f.

source [find interface/ch347.cfg]

if { [info exists TRANSPORT] && $TRANSPORT eq "swd" } {
	transport select swd
	adapter speed 5000
} else {
	transport select jtag
	# 0 errors from 469 kHz to 60 MHz on this wiring; memory reads are no faster above 15 MHz
	adapter speed 15000
}

reset_config none

source [find target/imx95.cfg]
